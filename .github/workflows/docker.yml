name: Docker Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-images:
    name: Build backend & frontend images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: lab-resource-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: lab-resource-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------------------------------------------
      # To publish to a registry (e.g. GHCR), add a docker/login-action
      # step, set push: true and tag with ghcr.io/${{ github.repository }}.
      # Left disabled — no registry credentials configured.
      # ----------------------------------------------------------------
