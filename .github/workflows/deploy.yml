name: Build, Push & Deploy

# Continuous delivery for the containerised stack:
#   1. build-and-push  — build both images and publish them to GHCR
#   2. deploy          — SSH into the cloud VM (AWS EC2 / Azure VM) and roll
#                        docker-compose.prod.yml onto the new image tag
#
# The deploy job is optional. With no DEPLOY_HOST secret configured it reports
# "skipped" and succeeds, so the workflow is green on a fresh clone. See
# DEPLOYMENT.md for the four secrets it needs.

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR rejects uppercase path segments, so this is lowercased deliberately and must
  # stay that way even if the GitHub account name is not.
  IMAGE_PREFIX: badalsingh25/lab-resource-platform

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          # GITHUB_TOKEN is issued per run; no registry secret needs to be stored.
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # Roll the new images onto the cloud host.
  # ------------------------------------------------------------------
  deploy:
    name: Deploy to cloud host
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      # secrets are not readable from a job-level `if:`, so the guard is a step.
      - name: Check whether a deploy target is configured
        id: target
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::DEPLOY_HOST is not set. Images were pushed to GHCR; configure the deploy secrets to roll them out automatically."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.target.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH || '~/lab-resource-platform' }}

            # The repo on the host supplies docker-compose.prod.yml, nginx.conf
            # and database/*.sql — the images alone are not enough.
            git fetch --all --prune
            git reset --hard origin/${{ github.ref_name }}

            # Pin this rollout to the commit that produced the images, so a
            # concurrent push cannot slip a different build onto the host.
            export IMAGE_TAG=${{ github.sha }}

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

            # Fail the deploy loudly if the API does not come back healthy.
            # The container's own health check already probes /actuator/health;
            # this just waits for its verdict.
            for i in $(seq 1 30); do
              status=$(docker inspect -f '{{.State.Health.Status}}' lab-resource-backend 2>/dev/null || echo starting)
              if [ "$status" = "healthy" ]; then
                echo "Backend healthy after ${i} check(s)."
                exit 0
              fi
              sleep 10
            done
            echo "Backend did not become healthy within 5 minutes." >&2
            docker compose -f docker-compose.prod.yml logs --tail=100 backend >&2
            exit 1
          envs: GHCR_USER,GHCR_TOKEN
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
