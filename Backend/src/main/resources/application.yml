server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/Labroatry
    username: postgres
    password: 1980
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update       # use validate/none + Flyway/Liquibase in production
    show-sql: true
    defer-datasource-initialization: true   # let Hibernate create tables BEFORE data.sql runs
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always          # runs data.sql on every startup (seeds the 6 fixed roles)
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:your_email@example.com}
    password: ${SPRING_MAIL_PASSWORD:your_mail_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  google:
    client-id: ${859293705785-vig2ia3i2js8pkc0dcqpjaldom5gas8o.apps.googleusercontent.com}
  jwt:
    # In production, load this from an environment variable / secrets manager — never hardcode it.
    secret: "${JWT_SECRET:63c64009015a63f75def522e8c9c639ad17cae0ea0f079845c35d9ee5d47bf51}"
    expiration-ms: 86400000   # 24 hours
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:YOUR_TWILIO_ACCOUNT_SID}
    auth-token: ${TWILIO_AUTH_TOKEN:YOUR_TWILIO_AUTH_TOKEN}
    from-number: ${TWILIO_FROM_NUMBER:+10000000000}
  demand:
    weights:
      booking-requests: 0.35
      waitlist-entries: 0.30
      rejected-ratio: 0.20
      lead-time: 0.15
    thresholds:
      idle-utilization: 0.15
      quadrant-utilization: 0.60
      quadrant-demand: 0.50
