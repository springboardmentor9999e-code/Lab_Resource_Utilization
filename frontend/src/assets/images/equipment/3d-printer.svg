<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="frame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="bed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>
  
  <!-- Outer Enclosure Structure -->
  <rect x="180" y="50" width="440" height="400" rx="20" fill="url(#frame)" stroke="#475569" stroke-width="4"/>
  <rect x="200" y="70" width="400" height="320" rx="12" fill="#090d16" stroke="#334155" stroke-width="2"/>
  
  <!-- Glass Window Tint -->
  <rect x="205" y="75" width="390" height="310" rx="8" fill="#38bdf8" fill-opacity="0.04"/>
  
  <!-- Vertical Rail Rods -->
  <line x1="230" y1="90" x2="230" y2="370" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  <line x1="570" y1="90" x2="570" y2="370" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Lead Screw -->
  <line x1="245" y1="90" x2="245" y2="370" stroke="#64748b" stroke-width="4" stroke-dasharray="2,2"/>
  <line x1="555" y1="90" x2="555" y2="370" stroke="#64748b" stroke-width="4" stroke-dasharray="2,2"/>

  <!-- Heated Print Bed Assembly -->
  <rect x="220" y="270" width="360" height="18" rx="4" fill="url(#bed)" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="230" y="288" width="340" height="12" fill="#334155" rx="2"/>
  <!-- Bed Grid Pattern -->
  <path d="M250 270 L250 288 M290 270 L290 288 M330 270 L330 288 M370 270 L370 288 M410 270 L410 288 M450 270 L450 288 M490 270 L490 288 M530 270 L530 288" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Printed 3D Prototype Model (Engine Gear Geometry) -->
  <path d="M 370 270 L 370 200 L 385 190 L 400 190 L 415 190 L 430 200 L 430 270 Z" fill="#f59e0b" fill-opacity="0.9" stroke="#fbbf24" stroke-width="2"/>
  <path d="M 360 270 L 370 230 L 430 230 L 440 270 Z" fill="#d97706" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="400" cy="215" r="12" fill="#78350f" stroke="#fbbf24" stroke-width="1.5"/>

  <!-- X-Axis Gantry Bar -->
  <rect x="205" y="145" width="390" height="16" rx="4" fill="#475569" stroke="#64748b" stroke-width="2"/>
  <line x1="210" y1="153" x2="590" y2="153" stroke="#cbd5e1" stroke-width="3"/>

  <!-- Extruder / Print Head -->
  <rect x="375" y="130" width="50" height="45" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
  <rect x="385" y="135" width="30" height="20" rx="3" fill="#1e293b"/>
  <!-- Status LED on Extruder -->
  <circle cx="390" cy="145" r="3" fill="#22c55e"/>
  <circle cx="410" cy="145" r="3" fill="#38bdf8"/>
  <!-- Nozzle & Hotend Glow -->
  <polygon points="393,175 407,175 400,188" fill="#f59e0b"/>
  <circle cx="400" cy="190" r="4" fill="#ef4444"/>
  <!-- Laser/Heat Beam Line -->
  <line x1="400" y1="188" x2="400" y2="190" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>

  <!-- Filament Tubes -->
  <path d="M 400 130 Q 350 90 280 90" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <path d="M 390 130 Q 330 80 250 85" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>

  <!-- Front Control Touch Screen -->
  <rect x="460" y="405" width="120" height="32" rx="6" fill="#020617" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="475" y="426" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">215°C  |  60°C</text>
  <circle cx="565" cy="421" r="5" fill="#22c55e"/>

  <!-- Brand / Title Label -->
  <text x="220" y="426" font-family="sans-serif" font-size="13" font-weight="bold" fill="#94a3b8" letter-spacing="1">INDUSTRIAL 3D PRINTER</text>
</svg>
