<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="vna" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>

  <!-- Instrument Chassis -->
  <rect x="90" y="60" width="620" height="380" rx="16" fill="url(#vna)" stroke="#0ea5e9" stroke-width="4"/>

  <!-- High-Res Dual Trace Screen -->
  <rect x="120" y="90" width="410" height="260" rx="10" fill="#020617" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- Screen Split: Left S11 Smith Chart, Right S21 Gain Curve -->
  <!-- Left Screen Grid: Smith Chart Impedance Circles -->
  <circle cx="215" cy="220" r="70" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="250" cy="220" r="35" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <path d="M 215 150 Q 280 170 285 220" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <path d="M 215 290 Q 280 270 285 220" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="145" y1="220" x2="285" y2="220" stroke="#334155"/>
  <!-- S11 Smith Chart Trace (Yellow) -->
  <path d="M 145 220 Q 200 160 230 200 T 275 220" fill="none" stroke="#facc15" stroke-width="2.5"/>

  <!-- Vertical Dividing Screen Line -->
  <line x1="320" y1="90" x2="320" y2="350" stroke="#334155" stroke-width="2"/>

  <!-- Right Screen Grid: S21 Insertion Loss / Gain (Cyan) -->
  <g stroke="#1e293b" stroke-width="1.5">
    <line x1="320" y1="155" x2="530" y2="155"/><line x1="320" y1="220" x2="530" y2="220"/><line x1="320" y1="285" x2="530" y2="285"/>
    <line x1="372" y1="90" x2="372" y2="350"/><line x1="425" y1="90" x2="425" y2="350"/><line x1="477" y1="90" x2="477" y2="350"/>
  </g>
  <!-- S21 Transmission Curve (Filter Passband Shape) -->
  <path d="M 320 310 L 390 310 L 400 140 L 450 140 L 460 310 L 530 310" fill="none" stroke="#38bdf8" stroke-width="2.5"/>

  <text x="130" y="112" font-family="monospace" font-size="10" font-weight="bold" fill="#facc15">Tr1 S11 Smith 1.00U/</text>
  <text x="330" y="112" font-family="monospace" font-size="10" font-weight="bold" fill="#38bdf8">Tr2 S21 LogM 10.0dB/</text>
  <text x="130" y="342" font-family="monospace" font-size="10" fill="#38bdf8">START 10.000 MHz  STOP 20.000000 GHz</text>

  <!-- Controls Panel (Right Side) -->
  <rect x="545" y="90" width="140" height="260" rx="8" fill="#1e293b" stroke="#334155"/>
  <circle cx="615" cy="140" r="22" fill="#0f172a" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="615" y1="140" x2="615" y2="124" stroke="#38bdf8" stroke-width="3"/>

  <!-- Navigation Keys -->
  <g fill="#0f172a" stroke="#475569" stroke-width="1">
    <rect x="560" y="180" width="28" height="18" rx="3"/><rect x="595" y="180" width="28" height="18" rx="3"/><rect x="630" y="180" width="28" height="18" rx="3"/>
    <rect x="560" y="205" width="28" height="18" rx="3"/><rect x="595" y="205" width="28" height="18" rx="3"/><rect x="630" y="205" width="28" height="18" rx="3"/>
    <rect x="560" y="230" width="28" height="18" rx="3"/><rect x="595" y="230" width="28" height="18" rx="3"/><rect x="630" y="230" width="28" height="18" rx="3"/>
  </g>
  <rect x="560" y="260" width="98" height="22" rx="4" fill="#0284c7"/>
  <text x="585" y="275" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">CALIBRATE</text>

  <!-- Precision RF 3.5mm Test Ports (Bottom Panel) -->
  <rect x="120" y="365" width="565" height="55" rx="8" fill="#020617" stroke="#334155"/>

  <!-- PORT 1 N-Type Precision Connector -->
  <circle cx="200" cy="392" r="18" fill="#eab308" stroke="#fef08a" stroke-width="2"/>
  <circle cx="200" cy="392" r="8" fill="#78350f"/>
  <text x="175" y="415" font-family="sans-serif" font-size="9" fill="#facc15" font-weight="bold">PORT 1 50Ω</text>

  <!-- PORT 2 N-Type Precision Connector -->
  <circle cx="380" cy="392" r="18" fill="#eab308" stroke="#fef08a" stroke-width="2"/>
  <circle cx="380" cy="392" r="8" fill="#78350f"/>
  <text x="355" y="415" font-family="sans-serif" font-size="9" fill="#facc15" font-weight="bold">PORT 2 50Ω</text>

  <!-- Title Label -->
  <text x="120" y="80" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cbd5e1" letter-spacing="1">VECTOR NETWORK ANALYZER 20GHz (S-PARAMETERS)</text>
</svg>
