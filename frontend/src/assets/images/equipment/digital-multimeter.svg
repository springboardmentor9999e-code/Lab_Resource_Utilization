<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="casing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>

  <!-- Multimeter Protective Bumper Case (Yellow/Amber Rubber Boot) -->
  <rect x="120" y="70" width="560" height="360" rx="20" fill="url(#casing)" stroke="#fbbf24" stroke-width="4"/>
  
  <!-- Dark Metal Instrument Chassis Inside -->
  <rect x="145" y="90" width="510" height="320" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <!-- High-Precision 6.5 Digit VFD / TFT Display Screen -->
  <rect x="175" y="115" width="450" height="130" rx="10" fill="#020617" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- Primary Measurement Value (V DC) -->
  <text x="200" y="180" font-family="monospace" font-size="44" font-weight="bold" fill="#38bdf8">11.99824 V</text>
  <text x="530" y="180" font-family="monospace" font-size="20" font-weight="bold" fill="#38bdf8">DC</text>
  <!-- Secondary Stats Display -->
  <text x="200" y="220" font-family="monospace" font-size="14" fill="#22c55e">AUTO  10V RANGE  |  Min: 11.996V  Max: 12.001V</text>

  <!-- Control Buttons Row -->
  <g fill="#334155" stroke="#64748b" stroke-width="1">
    <rect x="175" y="260" width="55" height="24" rx="4" fill="#0284c7"/><text x="190" y="276" font-family="sans-serif" font-size="10" fill="#fff" font-weight="bold">DC V</text>
    <rect x="240" y="260" width="55" height="24" rx="4"/><text x="255" y="276" font-family="sans-serif" font-size="10" fill="#cbd5e1">AC V</text>
    <rect x="305" y="260" width="55" height="24" rx="4"/><text x="320" y="276" font-family="sans-serif" font-size="10" fill="#cbd5e1">Ω 2W</text>
    <rect x="370" y="260" width="55" height="24" rx="4"/><text x="385" y="276" font-family="sans-serif" font-size="10" fill="#cbd5e1">DC I</text>
    <rect x="435" y="260" width="55" height="24" rx="4"/><text x="450" y="276" font-family="sans-serif" font-size="10" fill="#cbd5e1">FREQ</text>
    <rect x="500" y="260" width="55" height="24" rx="4" fill="#16a34a"/><text x="512" y="276" font-family="sans-serif" font-size="10" fill="#fff" font-weight="bold">MATH</text>
  </g>

  <!-- Input Terminals Panel (Right Bottom) -->
  <rect x="175" y="300" width="450" height="90" rx="8" fill="#1e293b" stroke="#475569"/>

  <!-- High Voltage Input Jacks -->
  <!-- Red HI Input Jack -->
  <circle cx="530" cy="330" r="14" fill="#dc2626" stroke="#f87171" stroke-width="2.5"/>
  <circle cx="530" cy="330" r="6" fill="#0f172a"/>
  <text x="522" y="358" font-family="sans-serif" font-size="9" fill="#f87171" font-weight="bold">V / Ω</text>

  <!-- Black LO / COM Jack -->
  <circle cx="585" cy="330" r="14" fill="#0f172a" stroke="#64748b" stroke-width="2.5"/>
  <circle cx="585" cy="330" r="6" fill="#334155"/>
  <text x="576" y="358" font-family="sans-serif" font-size="9" fill="#cbd5e1" font-weight="bold">LO COM</text>

  <!-- Current Input Jacks -->
  <circle cx="530" cy="370" r="12" fill="#dc2626" stroke="#f87171" stroke-width="2"/>
  <circle cx="585" cy="370" r="12" fill="#0f172a" stroke="#64748b" stroke-width="2"/>

  <!-- Power Switch & Rotary Selector (Left Bottom) -->
  <circle cx="230" cy="345" r="28" fill="#0f172a" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="230" y1="345" x2="230" y2="322" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

  <!-- Title Label -->
  <text x="175" y="86" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fef08a" letter-spacing="1">PRECISION 6.5 DIGIT BENCHTOP DIGITAL MULTIMETER</text>
</svg>
