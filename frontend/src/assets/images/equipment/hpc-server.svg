<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="server" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>

  <!-- 42U Server Rack Enclosure Frame -->
  <rect x="120" y="30" width="560" height="440" rx="14" fill="#090d16" stroke="#475569" stroke-width="4"/>
  <rect x="140" y="45" width="520" height="410" fill="#020617" stroke="#1e293b"/>

  <!-- Server Blade 1 (Top 2U Unit) -->
  <rect x="150" y="60" width="500" height="75" rx="6" fill="url(#server)" stroke="#3b82f6" stroke-width="2"/>
  <!-- Front Hot-Swap Drive Bays Grid -->
  <g fill="#0f172a" stroke="#64748b" stroke-width="1">
    <rect x="170" y="70" width="35" height="55" rx="2"/><rect x="210" y="70" width="35" height="55" rx="2"/>
    <rect x="250" y="70" width="35" height="55" rx="2"/><rect x="290" y="70" width="35" height="55" rx="2"/>
    <rect x="330" y="70" width="35" height="55" rx="2"/><rect x="370" y="70" width="35" height="55" rx="2"/>
    <rect x="410" y="70" width="35" height="55" rx="2"/><rect x="450" y="70" width="35" height="55" rx="2"/>
  </g>
  <!-- Activity LEDs -->
  <circle cx="178" cy="115" r="2.5" fill="#22c55e"/><circle cx="218" cy="115" r="2.5" fill="#22c55e"/>
  <circle cx="258" cy="115" r="2.5" fill="#22c55e"/><circle cx="298" cy="115" r="2.5" fill="#38bdf8"/>
  <circle cx="338" cy="115" r="2.5" fill="#22c55e"/><circle cx="378" cy="115" r="2.5" fill="#22c55e"/>
  <!-- Server LCD Status Panel -->
  <rect x="500" y="72" width="110" height="30" rx="4" fill="#020617" stroke="#3b82f6"/>
  <text x="510" y="91" font-family="monospace" font-size="10" font-weight="bold" fill="#38bdf8">R750xa  OK</text>

  <!-- Server Blade 2 (Middle 2U Unit) -->
  <rect x="150" y="150" width="500" height="75" rx="6" fill="url(#server)" stroke="#3b82f6" stroke-width="2"/>
  <g fill="#0f172a" stroke="#64748b" stroke-width="1">
    <rect x="170" y="160" width="35" height="55" rx="2"/><rect x="210" y="160" width="35" height="55" rx="2"/>
    <rect x="250" y="160" width="35" height="55" rx="2"/><rect x="290" y="160" width="35" height="55" rx="2"/>
    <rect x="330" y="160" width="35" height="55" rx="2"/><rect x="370" y="160" width="35" height="55" rx="2"/>
    <rect x="410" y="160" width="35" height="55" rx="2"/><rect x="450" y="160" width="35" height="55" rx="2"/>
  </g>
  <rect x="500" y="162" width="110" height="30" rx="4" fill="#020617" stroke="#22c55e"/>
  <text x="510" y="181" font-family="monospace" font-size="10" font-weight="bold" fill="#22c55e">CPU 64-CORE</text>

  <!-- Server Blade 3 (Bottom 2U Unit) -->
  <rect x="150" y="240" width="500" height="75" rx="6" fill="url(#server)" stroke="#3b82f6" stroke-width="2"/>
  <g fill="#0f172a" stroke="#64748b" stroke-width="1">
    <rect x="170" y="250" width="35" height="55" rx="2"/><rect x="210" y="250" width="35" height="55" rx="2"/>
    <rect x="250" y="250" width="35" height="55" rx="2"/><rect x="290" y="250" width="35" height="55" rx="2"/>
    <rect x="330" y="250" width="35" height="55" rx="2"/><rect x="370" y="250" width="35" height="55" rx="2"/>
    <rect x="410" y="250" width="35" height="55" rx="2"/><rect x="450" y="250" width="35" height="55" rx="2"/>
  </g>
  <rect x="500" y="252" width="110" height="30" rx="4" fill="#020617" stroke="#38bdf8"/>
  <text x="510" y="271" font-family="monospace" font-size="10" font-weight="bold" fill="#38bdf8">RAM 512GB</text>

  <!-- Network Switch Unit (48-Port High Speed Fiber) -->
  <rect x="150" y="330" width="500" height="40" rx="4" fill="#0f172a" stroke="#64748b"/>
  <!-- Fiber Optic Cable Connections -->
  <g fill="#38bdf8">
    <circle cx="170" cy="350" r="3"/><circle cx="180" cy="350" r="3"/><circle cx="190" cy="350" r="3"/><circle cx="200" cy="350" r="3"/>
    <circle cx="210" cy="350" r="3"/><circle cx="220" cy="350" r="3"/><circle cx="230" cy="350" r="3"/><circle cx="240" cy="350" r="3"/>
  </g>
  <path d="M 170 350 Q 150 400 130 430" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 190 350 Q 160 400 135 430" fill="none" stroke="#22c55e" stroke-width="2"/>

  <!-- Rack Handles Left and Right -->
  <rect x="130" y="60" width="15" height="310" rx="4" fill="#475569"/>
  <rect x="655" y="60" width="15" height="310" rx="4" fill="#475569"/>

  <!-- Title Label -->
  <text x="180" y="415" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8" letter-spacing="1">DUAL XEON HPC COMPUTATIONAL SERVER RACK</text>
</svg>
