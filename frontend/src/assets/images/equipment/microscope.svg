<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="column" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>

  <!-- FESEM Electron Column Unit (Center Left) -->
  <!-- Base Table Desk -->
  <rect x="100" y="340" width="360" height="100" rx="12" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <rect x="120" y="355" width="320" height="70" rx="6" fill="#0f172a"/>

  <!-- Vacuum Specimen Chamber -->
  <rect x="170" y="220" width="220" height="125" rx="16" fill="url(#column)" stroke="#334155" stroke-width="3"/>
  <circle cx="280" cy="280" r="35" fill="#0f172a" stroke="#0ea5e9" stroke-width="3"/>
  <!-- Specimen Viewport Glass -->
  <circle cx="280" cy="280" r="28" fill="#38bdf8" fill-opacity="0.15"/>
  <path d="M 265 285 L 280 270 L 295 285 Z" fill="#38bdf8"/>

  <!-- Vertical Electron Gun Column -->
  <rect x="235" y="45" width="90" height="180" rx="10" fill="url(#column)" stroke="#475569" stroke-width="3"/>
  <!-- Column Metallic Rings -->
  <rect x="225" y="75" width="110" height="16" rx="4" fill="#334155"/>
  <rect x="225" y="125" width="110" height="16" rx="4" fill="#334155"/>
  <rect x="225" y="175" width="110" height="16" rx="4" fill="#334155"/>

  <!-- High Voltage Beam Indicator -->
  <circle cx="280" cy="60" r="6" fill="#ef4444"/>
  <text x="268" y="38" font-family="sans-serif" font-size="9" fill="#f87171" font-weight="bold">30 kV</text>

  <!-- Stage XYZ Position Knobs -->
  <circle cx="140" cy="385" r="14" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="180" cy="385" r="14" fill="#334155" stroke="#94a3b8" stroke-width="2"/>

  <!-- Dual Display Imaging Monitors (Right Side Workstation) -->
  <!-- Monitor 1: Nanostructure SEM Imaging -->
  <rect x="470" y="80" width="240" height="170" rx="10" fill="#020617" stroke="#38bdf8" stroke-width="2.5"/>
  <!-- High Mag Nanostructure View (Nanowires / Graphene sheets) -->
  <rect x="480" y="90" width="220" height="130" rx="4" fill="#090d16"/>
  <!-- Nanowires / Crystal Grains Graphic -->
  <path d="M 490 190 Q 520 120 560 140 T 630 110 T 680 180" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
  <path d="M 510 120 Q 550 180 600 130 T 670 150" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <polygon points="540,160 560,130 580,170" fill="#64748b" fill-opacity="0.6"/>
  <polygon points="610,140 640,120 650,170" fill="#475569" fill-opacity="0.6"/>

  <!-- Scale Bar & Mag Text -->
  <line x1="490" y1="210" x2="540" y2="210" stroke="#ffffff" stroke-width="3"/>
  <text x="490" y="205" font-family="monospace" font-size="9" fill="#ffffff">500 nm</text>
  <text x="590" y="210" font-family="monospace" font-size="10" font-weight="bold" fill="#38bdf8">MAG: 150,000x</text>

  <!-- Monitor 2: Control & EDX Elemental Spectrum -->
  <rect x="470" y="265" width="240" height="160" rx="10" fill="#020617" stroke="#a855f7" stroke-width="2"/>
  <rect x="480" y="275" width="220" height="120" rx="4" fill="#090d16"/>
  <!-- EDX Spectrum Peaks -->
  <path d="M 490 380 L 510 380 L 515 300 L 520 380 L 545 380 L 550 280 L 555 380 L 580 380 L 585 340 L 590 380 L 680 380" fill="none" stroke="#c084fc" stroke-width="2"/>
  <text x="490" y="290" font-family="monospace" font-size="9" fill="#c084fc">EDX: Si, Au, C, O</text>

  <!-- Title Label -->
  <text x="100" y="465" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cbd5e1" letter-spacing="1">FIELD EMISSION SCANNING ELECTRON MICROSCOPE (FESEM)</text>
</svg>
