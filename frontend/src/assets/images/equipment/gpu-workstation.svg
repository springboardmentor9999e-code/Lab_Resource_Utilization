<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tower" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="nvgreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>

  <!-- High End Full-Tower PC Case -->
  <rect x="220" y="40" width="360" height="420" rx="20" fill="url(#tower)" stroke="#334155" stroke-width="4"/>
  
  <!-- Tempered Glass Side Panel View -->
  <rect x="240" y="60" width="320" height="380" rx="12" fill="#020617" stroke="#22c55e" stroke-width="2"/>
  <rect x="245" y="65" width="310" height="370" rx="8" fill="#22c55e" fill-opacity="0.03"/>

  <!-- Motherboard Board Tray -->
  <rect x="260" y="80" width="280" height="340" rx="6" fill="#0b1329"/>

  <!-- CPU Liquid Cooler Pump Block (RGB Glow) -->
  <circle cx="340" cy="140" r="30" fill="#0f172a" stroke="url(#nvgreen)" stroke-width="4"/>
  <circle cx="340" cy="140" r="20" fill="#22c55e" fill-opacity="0.2"/>
  <text x="325" y="144" font-family="sans-serif" font-size="10" font-weight="bold" fill="#22c55e">THREAD</text>

  <!-- Cooling Hoses / Tubes -->
  <path d="M 340 110 Q 340 85 450 85" fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round"/>
  <path d="M 355 115 Q 360 95 460 95" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>

  <!-- Top 360mm Radiator Fans -->
  <rect x="430" y="70" width="100" height="30" rx="4" fill="#1e293b"/>
  <circle cx="450" cy="85" r="10" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <circle cx="480" cy="85" r="10" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <circle cx="510" cy="85" r="10" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>

  <!-- Quad NVIDIA A100 / H100 GPU Cards Stack -->
  <!-- GPU 1 -->
  <rect x="280" y="200" width="240" height="32" rx="4" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <rect x="290" y="206" width="140" height="20" rx="2" fill="#0f172a"/>
  <text x="298" y="220" font-family="sans-serif" font-size="10" font-weight="bold" fill="#22c55e">NVIDIA A100 80GB</text>
  <circle cx="485" cy="216" r="8" fill="#22c55e"/>

  <!-- GPU 2 -->
  <rect x="280" y="242" width="240" height="32" rx="4" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <rect x="290" y="248" width="140" height="20" rx="2" fill="#0f172a"/>
  <text x="298" y="262" font-family="sans-serif" font-size="10" font-weight="bold" fill="#22c55e">NVIDIA A100 80GB</text>
  <circle cx="485" cy="258" r="8" fill="#22c55e"/>

  <!-- GPU 3 -->
  <rect x="280" y="284" width="240" height="32" rx="4" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <rect x="290" y="290" width="140" height="20" rx="2" fill="#0f172a"/>
  <text x="298" y="304" font-family="sans-serif" font-size="10" font-weight="bold" fill="#22c55e">NVIDIA A100 80GB</text>
  <circle cx="485" cy="300" r="8" fill="#22c55e"/>

  <!-- GPU 4 -->
  <rect x="280" y="326" width="240" height="32" rx="4" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <rect x="290" y="332" width="140" height="20" rx="2" fill="#0f172a"/>
  <text x="298" y="346" font-family="sans-serif" font-size="10" font-weight="bold" fill="#22c55e">NVIDIA A100 80GB</text>
  <circle cx="485" cy="342" r="8" fill="#22c55e"/>

  <!-- NVLink Bridge Connectors -->
  <rect x="500" y="195" width="12" height="168" rx="3" fill="#eab308"/>

  <!-- Power Supply Shroud Unit (Bottom) -->
  <rect x="260" y="370" width="280" height="45" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="280" y="396" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cbd5e1">2000W PLATINUM PSU</text>

  <!-- Title Label -->
  <text x="250" y="448" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4ade80" letter-spacing="1">4x NVIDIA A100 DEEP LEARNING WORKSTATION</text>
</svg>
