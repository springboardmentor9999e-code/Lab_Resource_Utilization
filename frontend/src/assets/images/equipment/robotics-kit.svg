<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="arm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>

  <!-- Experiment Table Base -->
  <rect x="100" y="320" width="600" height="120" rx="12" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <rect x="120" y="335" width="560" height="90" rx="8" fill="#0f172a"/>

  <!-- Robotic Arm Base Station -->
  <rect x="220" y="270" width="140" height="60" rx="10" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <ellipse cx="290" cy="270" rx="50" ry="12" fill="#64748b"/>
  <!-- Base Servo Motor -->
  <circle cx="290" cy="265" r="22" fill="#020617" stroke="#38bdf8" stroke-width="3"/>

  <!-- Articulated Robotic Arm Link 1 -->
  <line x1="290" y1="265" x2="380" y2="150" stroke="url(#arm)" stroke-width="18" stroke-linecap="round"/>
  <line x1="290" y1="265" x2="380" y2="150" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-dasharray="8,8"/>

  <!-- Joint 2 Servo Motor -->
  <circle cx="380" cy="150" r="20" fill="#020617" stroke="#a855f7" stroke-width="3"/>
  <circle cx="380" cy="150" r="8" fill="#a855f7"/>

  <!-- Articulated Robotic Arm Link 2 -->
  <line x1="380" y1="150" x2="490" y2="170" stroke="url(#arm)" stroke-width="14" stroke-linecap="round"/>

  <!-- End Effector Gripper Assembly -->
  <circle cx="490" cy="170" r="14" fill="#020617" stroke="#f59e0b" stroke-width="2"/>
  <!-- Two Finger Gripper Claws -->
  <path d="M 495 160 L 525 145 L 535 155" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <path d="M 495 180 L 525 195 L 535 185" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>

  <!-- Object being manipulated (Sphere ball) -->
  <circle cx="540" cy="170" r="14" fill="#ef4444" stroke="#f87171" stroke-width="2"/>

  <!-- Microcontroller DAQ Control Board (Right Side) -->
  <rect x="440" y="345" width="220" height="70" rx="8" fill="#065f46" stroke="#34d399" stroke-width="2"/>
  <!-- IC Chips on Board -->
  <rect x="460" y="355" width="40" height="30" rx="3" fill="#0f172a"/>
  <rect x="520" y="355" width="60" height="20" rx="3" fill="#0f172a"/>
  <circle cx="630" cy="370" r="10" fill="#38bdf8"/>
  <text x="590" y="402" font-family="monospace" font-size="10" font-weight="bold" fill="#34d399">NI DAQ USB</text>

  <!-- Control Wires & Cable Harness -->
  <path d="M 290 265 Q 350 360 440 360" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4,4"/>
  <path d="M 380 150 Q 400 300 460 360" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4,4"/>

  <!-- Title Label -->
  <text x="140" y="80" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cbd5e1" letter-spacing="1">MODULAR ROBOTICS &amp; MECHATRONICS CONTROL KIT</text>
</svg>
