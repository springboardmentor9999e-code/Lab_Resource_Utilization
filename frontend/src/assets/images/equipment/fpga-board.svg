<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pcb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>

  <!-- FPGA Printed Circuit Board (Green PCB Base) -->
  <rect x="120" y="50" width="560" height="400" rx="16" fill="url(#pcb)" stroke="#34d399" stroke-width="3"/>
  <!-- Gold Mounting Holes -->
  <circle cx="150" cy="80" r="8" fill="#eab308" stroke="#78350f" stroke-width="2"/>
  <circle cx="650" cy="80" r="8" fill="#eab308" stroke="#78350f" stroke-width="2"/>
  <circle cx="150" cy="420" r="8" fill="#eab308" stroke="#78350f" stroke-width="2"/>
  <circle cx="650" cy="420" r="8" fill="#eab308" stroke="#78350f" stroke-width="2"/>

  <!-- Copper PCB Trace Lines Pattern -->
  <path d="M 160 120 L 300 120 L 350 170 M 200 250 L 300 250 L 350 220 
           M 450 220 L 520 220 L 560 180 M 450 280 L 540 280 L 580 320" 
        fill="none" stroke="#a7f3d0" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Main FPGA System-on-Chip (Zynq UltraScale+ Chip with Heatsink) -->
  <rect x="330" y="160" width="140" height="140" rx="12" fill="#0f172a" stroke="#cbd5e1" stroke-width="3"/>
  <!-- Aluminum Heatsink Fins -->
  <rect x="345" y="175" width="110" height="110" rx="6" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="360" y1="175" x2="360" y2="285" stroke="#64748b" stroke-width="4"/>
  <line x1="380" y1="175" x2="380" y2="285" stroke="#64748b" stroke-width="4"/>
  <line x1="400" y1="175" x2="400" y2="285" stroke="#64748b" stroke-width="4"/>
  <line x1="420" y1="175" x2="420" y2="285" stroke="#64748b" stroke-width="4"/>
  <line x1="440" y1="175" x2="440" y2="285" stroke="#64748b" stroke-width="4"/>
  <!-- Xilinx Logo / Chip Label -->
  <text x="365" y="235" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399">ULTRASCALE+</text>

  <!-- DDR4 RAM DIMM Slots (Top Side) -->
  <rect x="250" y="75" width="300" height="25" rx="4" fill="#020617" stroke="#94a3b8"/>
  <rect x="260" y="80" width="280" height="15" fill="#1e293b"/>

  <!-- FMC HPC High Speed Connector (Right Side) -->
  <rect x="580" y="140" width="45" height="180" rx="4" fill="#020617" stroke="#38bdf8" stroke-width="2"/>
  <g fill="#38bdf8">
    <circle cx="595" cy="160" r="2"/><circle cx="610" cy="160" r="2"/>
    <circle cx="595" cy="180" r="2"/><circle cx="610" cy="180" r="2"/>
    <circle cx="595" cy="200" r="2"/><circle cx="610" cy="200" r="2"/>
    <circle cx="595" cy="220" r="2"/><circle cx="610" cy="220" r="2"/>
    <circle cx="595" cy="240" r="2"/><circle cx="610" cy="240" r="2"/>
    <circle cx="595" cy="260" r="2"/><circle cx="610" cy="260" r="2"/>
    <circle cx="595" cy="280" r="2"/><circle cx="610" cy="280" r="2"/>
    <circle cx="595" cy="300" r="2"/><circle cx="610" cy="300" r="2"/>
  </g>

  <!-- Dual Gigabit RJ45 Ethernet Connectors (Left Edge) -->
  <rect x="110" y="150" width="40" height="45" rx="4" fill="#64748b" stroke="#cbd5e1"/>
  <rect x="110" y="210" width="40" height="45" rx="4" fill="#64748b" stroke="#cbd5e1"/>

  <!-- User LEDs Row -->
  <g fill="#22c55e">
    <circle cx="200" cy="380" r="4"/><circle cx="215" cy="380" r="4"/><circle cx="230" cy="380" r="4"/><circle cx="245" cy="380" r="4"/>
    <circle cx="260" cy="380" r="4" fill="#ef4444"/><circle cx="275" cy="380" r="4" fill="#38bdf8"/><circle cx="290" cy="380" r="4"/><circle cx="305" cy="380" r="4"/>
  </g>

  <!-- DIP Switches Bank -->
  <rect x="340" y="370" width="80" height="25" rx="3" fill="#dc2626"/>
  <g fill="#ffffff">
    <rect x="350" y="373" width="6" height="10" rx="1"/><rect x="362" y="380" width="6" height="10" rx="1"/>
    <rect x="374" y="373" width="6" height="10" rx="1"/><rect x="386" y="380" width="6" height="10" rx="1"/>
    <rect x="398" y="373" width="6" height="10" rx="1"/>
  </g>

  <!-- PCIe Edge Connector (Bottom) -->
  <rect x="460" y="420" width="160" height="20" rx="2" fill="#eab308"/>
  <g stroke="#78350f" stroke-width="2">
    <line x1="470" y1="420" x2="470" y2="440"/><line x1="480" y1="420" x2="480" y2="440"/><line x1="490" y1="420" x2="490" y2="440"/><line x1="500" y1="420" x2="500" y2="440"/>
    <line x1="510" y1="420" x2="510" y2="440"/><line x1="520" y1="420" x2="520" y2="440"/><line x1="530" y1="420" x2="530" y2="440"/><line x1="540" y1="420" x2="540" y2="440"/>
  </g>

  <!-- Title Label -->
  <text x="160" y="465" font-family="sans-serif" font-size="11" font-weight="bold" fill="#6ee7b7" letter-spacing="1">FPGA MPSOC EVALUATION &amp; ACCELERATION BOARD</text>
</svg>
