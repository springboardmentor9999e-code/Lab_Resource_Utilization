<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="case" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>

  <!-- Oscilloscope Main Chassis -->
  <rect x="100" y="60" width="600" height="380" rx="16" fill="url(#case)" stroke="#64748b" stroke-width="4"/>
  <!-- Top Handle -->
  <rect x="260" y="42" width="280" height="18" rx="6" fill="#475569" stroke="#94a3b8" stroke-width="2"/>

  <!-- Main Display Screen Frame -->
  <rect x="130" y="90" width="370" height="260" rx="10" fill="#020617" stroke="#3b82f6" stroke-width="3"/>

  <!-- Screen Grid Lines -->
  <g stroke="#1e293b" stroke-width="1.5">
    <line x1="130" y1="142" x2="500" y2="142"/><line x1="130" y1="194" x2="500" y2="194"/><line x1="130" y1="246" x2="500" y2="246"/><line x1="130" y1="298" x2="500" y2="298"/>
    <line x1="191" y1="90" x2="191" y2="350"/><line x1="252" y1="90" x2="252" y2="350"/><line x1="315" y1="90" x2="315" y2="350"/><line x1="376" y1="90" x2="376" y2="350"/><line x1="438" y1="90" x2="438" y2="350"/>
  </g>
  <!-- Center Dashed Axes -->
  <line x1="130" y1="220" x2="500" y2="220" stroke="#334155" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="315" y1="90" x2="315" y2="350" stroke="#334155" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Waveform CH1 (Sine Wave - Bright Yellow) -->
  <path d="M 130 220 Q 153 140 176 220 T 222 220 T 268 220 T 314 220 T 360 220 T 406 220 T 452 220 T 498 220" fill="none" stroke="#facc15" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Waveform CH2 (Square Wave - Cyan) -->
  <path d="M 130 270 L 170 270 L 170 170 L 230 170 L 230 270 L 290 270 L 290 170 L 350 170 L 350 270 L 410 270 L 410 170 L 470 170 L 470 270 L 500 270" fill="none" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- Screen Measurement Overlay Info -->
  <text x="142" y="112" font-family="monospace" font-size="11" font-weight="bold" fill="#facc15">CH1: 2.00V  1.00kHz</text>
  <text x="320" y="112" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8">CH2: 5.00V  2.50MHz</text>
  <text x="142" y="340" font-family="monospace" font-size="11" fill="#22c55e">TRIG: AUTO  CH1  200mV</text>

  <!-- Control Panel Right Side -->
  <rect x="520" y="90" width="155" height="260" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>

  <!-- Large Rotary Knobs (Vertical / Horizontal Scale) -->
  <circle cx="560" cy="130" r="18" fill="#334155" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="560" y1="130" x2="560" y2="116" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <text x="542" y="160" font-family="sans-serif" font-size="9" fill="#94a3b8" font-weight="bold">VOLTS/DIV</text>

  <circle cx="635" cy="130" r="18" fill="#334155" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="635" y1="130" x2="647" y2="130" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
  <text x="618" y="160" font-family="sans-serif" font-size="9" fill="#94a3b8" font-weight="bold">TIME/DIV</text>

  <!-- Secondary Adjust Knobs -->
  <circle cx="560" cy="195" r="12" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="600" cy="195" r="12" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="640" cy="195" r="12" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>

  <!-- Function Buttons Row -->
  <rect x="535" y="230" width="22" height="14" rx="3" fill="#3b82f6"/>
  <rect x="565" y="230" width="22" height="14" rx="3" fill="#334155"/>
  <rect x="595" y="230" width="22" height="14" rx="3" fill="#334155"/>
  <rect x="625" y="230" width="22" height="14" rx="3" fill="#22c55e"/>

  <!-- BNC Input Channels Panel (Bottom Row) -->
  <rect x="130" y="365" width="545" height="55" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <!-- BNC Connectors CH1 - CH4 -->
  <!-- CH1 -->
  <circle cx="180" cy="392" r="14" fill="#334155" stroke="#facc15" stroke-width="3"/>
  <circle cx="180" cy="392" r="5" fill="#0f172a"/>
  <text x="170" y="415" font-family="sans-serif" font-size="9" fill="#facc15" font-weight="bold">CH 1</text>

  <!-- CH2 -->
  <circle cx="270" cy="392" r="14" fill="#334155" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="270" cy="392" r="5" fill="#0f172a"/>
  <text x="260" y="415" font-family="sans-serif" font-size="9" fill="#38bdf8" font-weight="bold">CH 2</text>

  <!-- CH3 -->
  <circle cx="360" cy="392" r="14" fill="#334155" stroke="#a855f7" stroke-width="3"/>
  <circle cx="360" cy="392" r="5" fill="#0f172a"/>
  <text x="350" y="415" font-family="sans-serif" font-size="9" fill="#a855f7" font-weight="bold">CH 3</text>

  <!-- CH4 -->
  <circle cx="450" cy="392" r="14" fill="#334155" stroke="#22c55e" stroke-width="3"/>
  <circle cx="450" cy="392" r="5" fill="#0f172a"/>
  <text x="440" y="415" font-family="sans-serif" font-size="9" fill="#22c55e" font-weight="bold">CH 4</text>

  <!-- USB Port & Power Button -->
  <rect x="525" y="382" width="24" height="20" rx="3" fill="#1e293b" stroke="#64748b"/>
  <circle cx="630" cy="392" r="12" fill="#ef4444" stroke="#f87171" stroke-width="2"/>

  <!-- Title Label -->
  <text x="130" y="78" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cbd5e1" letter-spacing="1">DIGITAL STORAGE OSCILLOSCOPE 200MHz</text>
</svg>
