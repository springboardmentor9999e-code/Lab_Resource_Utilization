<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="chassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>

  <!-- Instrument Chassis -->
  <rect x="90" y="60" width="620" height="380" rx="16" fill="url(#chassis)" stroke="#4338ca" stroke-width="4"/>

  <!-- Large Display Screen Frame -->
  <rect x="120" y="90" width="410" height="260" rx="10" fill="#020617" stroke="#6366f1" stroke-width="2.5"/>

  <!-- Spectrum Analyzer Grid Lines -->
  <g stroke="#1e1b4b" stroke-width="1.5">
    <line x1="120" y1="140" x2="530" y2="140"/><line x1="120" y1="190" x2="530" y2="190"/><line x1="120" y1="240" x2="530" y2="240"/><line x1="120" y1="290" x2="530" y2="290"/>
    <line x1="171" y1="90" x2="171" y2="350"/><line x1="222" y1="90" x2="222" y2="350"/><line x1="273" y1="90" x2="273" y2="350"/><line x1="325" y1="90" x2="325" y2="350"/>
    <line x1="376" y1="90" x2="376" y2="350"/><line x1="427" y1="90" x2="427" y2="350"/><line x1="478" y1="90" x2="478" y2="350"/>
  </g>

  <!-- RF Spectrum Trace Peak Plot (Green/Neon Spectrum Lines) -->
  <!-- Noise Floor -->
  <path d="M 120 320 L 140 315 L 160 322 L 180 318 L 200 324 L 210 320 
           L 220 318 L 230 140 L 240 318 L 250 322 L 270 319 L 290 321
           L 310 320 L 320 210 L 330 322 L 350 318 L 380 320 L 400 317
           L 410 260 L 420 322 L 450 319 L 480 321 L 530 320" 
        fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Peak Marker Arrow & Label -->
  <polygon points="230,125 224,113 236,113" fill="#f43f5e"/>
  <text x="240" y="120" font-family="monospace" font-size="11" font-weight="bold" fill="#f43f5e">M1: 2.412 GHz (-12.4 dBm)</text>

  <!-- Screen Readout Info -->
  <text x="130" y="112" font-family="monospace" font-size="10" fill="#a5b4fc">REF: 0.0 dBm  ATTEN: 10 dB</text>
  <text x="130" y="342" font-family="monospace" font-size="10" fill="#a5b4fc">CENTER: 2.400 GHz  SPAN: 100.0 MHz  RBW: 100 kHz</text>

  <!-- Controls Panel (Right Side) -->
  <rect x="545" y="90" width="140" height="260" rx="8" fill="#1e1b4b" stroke="#3730a3"/>

  <!-- Rotary Frequency Wheel -->
  <circle cx="615" cy="140" r="24" fill="#0f172a" stroke="#818cf8" stroke-width="3"/>
  <line x1="615" y1="140" x2="615" y2="124" stroke="#818cf8" stroke-width="3"/>

  <!-- Keypad Array -->
  <g fill="#0f172a" stroke="#4338ca" stroke-width="1">
    <rect x="560" y="180" width="28" height="18" rx="3"/><rect x="595" y="180" width="28" height="18" rx="3"/><rect x="630" y="180" width="28" height="18" rx="3"/>
    <rect x="560" y="205" width="28" height="18" rx="3"/><rect x="595" y="205" width="28" height="18" rx="3"/><rect x="630" y="205" width="28" height="18" rx="3"/>
    <rect x="560" y="230" width="28" height="18" rx="3"/><rect x="595" y="230" width="28" height="18" rx="3"/><rect x="630" y="230" width="28" height="18" rx="3"/>
  </g>
  <!-- Peak Search Button -->
  <rect x="560" y="260" width="98" height="22" rx="4" fill="#6366f1"/>
  <text x="578" y="275" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">PEAK SEARCH</text>

  <!-- Bottom Panel (RF Input Port & Power) -->
  <rect x="120" y="365" width="565" height="55" rx="8" fill="#020617" stroke="#3730a3"/>

  <!-- RF N-Type Input Connector (Golden Metallic) -->
  <circle cx="170" cy="392" r="16" fill="#eab308" stroke="#fef08a" stroke-width="2"/>
  <circle cx="170" cy="392" r="7" fill="#78350f"/>
  <text x="145" y="415" font-family="sans-serif" font-size="9" fill="#facc15" font-weight="bold">RF IN 50Ω</text>

  <!-- Probe Power Outputs -->
  <circle cx="270" cy="392" r="10" fill="#334155" stroke="#a5b4fc" stroke-width="1.5"/>
  <circle cx="320" cy="392" r="10" fill="#334155" stroke="#a5b4fc" stroke-width="1.5"/>

  <text x="120" y="80" font-family="sans-serif" font-size="12" font-weight="bold" fill="#c7d2fe" letter-spacing="1">SPECTRUM &amp; SIGNAL ANALYZER 13.5GHz</text>
</svg>
