spring.application.name=lab-resource-utilization-platform
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

spring.datasource.url=jdbc:postgresql://localhost:5432/lab_resource_db
spring.datasource.username=postgres
spring.datasource.password=2007

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

jwt.secret=MySecretKeyForLabResourceUtilizationPlatform2026MySecretKey
jwt.expiration=3600000

# Email Delivery Configuration (Configurable via ENV variables or properties)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${SMTP_FROM_EMAIL:noreply@labresource.com}
app.mail.enabled=${EMAIL_NOTIFICATIONS_ENABLED:true}

# SMS Delivery Configuration (Configurable via ENV variables or properties)
app.sms.provider=${SMS_PROVIDER:mock}
app.sms.api-key=${SMS_API_KEY:}
app.sms.api-secret=${SMS_API_SECRET:}
app.sms.sender-id=${SMS_SENDER_ID:LABRES}
app.sms.url=${SMS_GATEWAY_URL:}
app.sms.enabled=${SMS_NOTIFICATIONS_ENABLED:true}

# Google OAuth 2.0 Configuration
# Set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET environment variables or pass via system properties.
# Authorized JavaScript Origins: http://localhost:3000
# Authorized Redirect URIs: http://localhost:3000
google.client-id=${GOOGLE_CLIENT_ID:818937469889-hv4k2ig0ev0brbmc67vps571ervsq8fu.apps.googleusercontent.com}
google.client-secret=${GOOGLE_CLIENT_SECRET:}

server.error.include-message=always


