server.port=8080

spring.application.name=lab-resource-utilization-platform

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lab_resource_platform}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=true

app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

application.security.jwt.secret-key=${APPLICATION_SECURITY_JWT_SECRET_KEY:}
application.security.jwt.expiration-ms=${APPLICATION_SECURITY_JWT_EXPIRATION_MS:86400000}
