spring.application.name=lab-resource-platform

# ---------- Database ----------
# Defaults target a local dev Postgres only. Set DB_PASSWORD in your environment (or a
# .env file) to whatever your local server uses — no password belongs in this file, which
# is committed. The production profile refuses to start without one; see
# application-prod.properties.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lab_resource_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Dev convenience: let Hibernate reconcile the schema while entities are still moving.
# Production runs the numbered scripts in database/ and validates instead — an accidental
# schema edit against real data is not something a dev-time default should be able to do.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---------- First-run bootstrap ----------
# The application seeds NO sample labs, equipment or bookings — you enter all of that yourself.
# These three rows are the exception, because the schema and login flow cannot work without them:
# app_user.institution_id and department_id are NOT NULL, and only an existing admin can grant
# roles. Each is created only when its table is empty, so renaming them from the UI is permanent.
app.bootstrap.institution-name=${BOOTSTRAP_INSTITUTION_NAME:My Institution}
app.bootstrap.institution-code=${BOOTSTRAP_INSTITUTION_CODE:INST-01}
app.bootstrap.department-name=${BOOTSTRAP_DEPARTMENT_NAME:General}
app.bootstrap.department-code=${BOOTSTRAP_DEPARTMENT_CODE:GEN}
app.bootstrap.admin-username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:admin@labresource.local}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:admin123}

# ---------- JWT ----------
# Dev-only fallback. Anyone reading this repository can forge a token signed with it, so
# the production profile has no default and fails fast if JWT_SECRET is unset.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-jwt-secret-do-not-use-outside-localhost-0000}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- Google OAuth2 ----------
# When set, the backend verifies the 'aud' claim of Google ID tokens against this client id
app.oauth.google-client-id=${GOOGLE_CLIENT_ID:}

# ---------- Mail (OTP password reset + notifications) ----------
# Real email requires a Gmail App Password (Google Account > Security > 2-Step Verification > App Passwords).
# Set MAIL_USERNAME to your Gmail address and MAIL_PASSWORD to the 16-char app password.
# If credentials are missing or sending fails, the OTP is logged to this console instead.
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:no-reply@labresource.com}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ---------- SMS (Twilio) ----------
# Urgent alerts only (waitlist claims, day-before booking reminders, work order assignment,
# overdue calibration) — SMS is billed per message, so it is not used for routine notices.
# Leave disabled and the message is logged instead of sent, which keeps the flow demonstrable.
# Numbers must be E.164 ("+919876543210"); a user with no phone on file is skipped.
app.sms.enabled=${SMS_ENABLED:false}
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.from-number=${TWILIO_FROM_NUMBER:}

# ---------- Push notifications (Firebase Cloud Messaging) ----------
# Point FIREBASE_CREDENTIALS at a service account JSON key
# (Firebase console > Project settings > Service accounts > Generate new private key).
# Same fallback contract as mail and SMS: unset means log, never fail.
app.push.enabled=${PUSH_ENABLED:false}
app.push.firebase-credentials=${FIREBASE_CREDENTIALS:}

# ---------- CORS ----------
# Comma-separated browser origins allowed to call the API. A deployed frontend lives on
# its own origin and must be listed here, e.g.
#   CORS_ALLOWED_ORIGINS=https://lab-resource-frontend.onrender.com
# Never "*": credentials are enabled, and browsers reject that combination outright.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

# ---------- API Gateway: rate limiting ----------
# Token bucket per client IP, refilled continuously. The auth tier is deliberately tight because
# those endpoints are unauthenticated and brute-forceable; the API tier is sized so a dashboard
# page load (which fires several parallel requests) never trips it.
app.ratelimit.enabled=${RATELIMIT_ENABLED:true}
app.ratelimit.auth-requests-per-minute=${RATELIMIT_AUTH_PER_MIN:20}
app.ratelimit.api-requests-per-minute=${RATELIMIT_API_PER_MIN:200}

# ---------- API Gateway: request logging ----------
app.logging.requests-enabled=${REQUEST_LOGGING_ENABLED:true}
app.logging.slow-request-ms=${SLOW_REQUEST_MS:2000}

# ---------- Utilization ----------
# Target a department/institution is measured against when it has not set one of its own.
app.utilization.default-target-percent=${UTILIZATION_DEFAULT_TARGET:60}

# ---------- Waitlist ----------
# How long a notified user keeps their claim on a freed slot before it passes to the next in line.
# Swept every 15 minutes by WaitlistOfferExpiryJob.
app.waitlist.offer-window-hours=${WAITLIST_OFFER_WINDOW_HOURS:24}

# ---------- File Uploads (equipment images & documents) ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
app.upload.dir=${UPLOAD_DIR:uploads}
