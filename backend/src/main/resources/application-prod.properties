# ============================================================
# Lab Resource Utilization Platform — Production Hardened Profile
# Enable with: --spring.profiles.active=prod
# ============================================================

spring.application.name=lab-resource-platform

# ---------- Database Hardening ----------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# In production, Hibernate DDL MUST NOT modify the database on boot.
# All schema modifications must come from raw migration scripts.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---------- JWT Hardening ----------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- Google OAuth2 ----------
app.oauth.google-client-id=${GOOGLE_CLIENT_ID:}

# ---------- Mail ----------
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:no-reply@labresource.com}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# ---------- SMS & Push Notifications ----------
app.sms.enabled=${SMS_ENABLED:false}
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.from-number=${TWILIO_FROM_NUMBER:}

app.push.enabled=${PUSH_ENABLED:false}
app.push.firebase-credentials=${FIREBASE_CREDENTIALS:}

# ---------- Security & Rate Limiting ----------
app.ratelimit.enabled=true
app.ratelimit.auth-requests-per-minute=20
app.ratelimit.api-requests-per-minute=200
app.logging.requests-enabled=true
app.logging.slow-request-ms=1000

# ---------- File Uploads ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
app.upload.dir=${UPLOAD_DIR:/app/uploads}
