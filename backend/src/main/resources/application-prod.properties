# ============================================================
# Lab Resource Utilization Platform — Production Hardened Profile
# Enable with: --spring.profiles.active=prod
# ============================================================

spring.application.name=lab-resource-platform

# ---------- Database Hardening ----------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# In production, Hibernate DDL MUST NOT modify the database on boot.
# All schema modifications must come from raw migration scripts.
# validate also means an entity change that arrives without its migration fails the
# deploy loudly here, instead of quietly altering a table holding real data.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Lazy loading outside a transaction hides N+1 queries behind the view layer and holds a
# connection for the whole request.
spring.jpa.open-in-view=false

# ---------- JWT Hardening ----------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- First-run bootstrap ----------
# No default: the bootstrap admin password is a real credential here, and inheriting
# 'admin123' from the base profile would ship a known login with every deploy.
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD}

# ---------- Error responses ----------
# Stack traces and framework messages describe internals to strangers.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# ---------- Google OAuth2 ----------
app.oauth.google-client-id=${GOOGLE_CLIENT_ID:}

# ---------- Mail ----------
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:no-reply@labresource.com}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# ---------- SMS & Push Notifications ----------
app.sms.enabled=${SMS_ENABLED:false}
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.from-number=${TWILIO_FROM_NUMBER:}

app.push.enabled=${PUSH_ENABLED:false}
app.push.firebase-credentials=${FIREBASE_CREDENTIALS:}

# ---------- Security & Rate Limiting ----------
app.ratelimit.enabled=true
app.ratelimit.auth-requests-per-minute=20
app.ratelimit.api-requests-per-minute=200
app.logging.requests-enabled=true
app.logging.slow-request-ms=1000

# ---------- File Uploads ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
app.upload.dir=${UPLOAD_DIR:/app/uploads}

# ---------- Server ----------
# Managed hosts (Render, Railway, Fly) assign the port at runtime and route to it. Binding
# a fixed 8080 there means the platform's health check never connects and the deploy is
# rolled back as unhealthy.
server.port=${PORT:8080}

# ---------- Actuator ----------
# Health only. The remaining endpoints (env, beans, mappings, heapdump) describe internals
# and are not something to publish alongside a public URL.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---------- Logging ----------
logging.level.root=INFO
logging.level.com.labresource=INFO
logging.level.org.hibernate.SQL=WARN
