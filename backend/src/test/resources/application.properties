# ============================================================
# Test profile — in-memory H2, no external services required
# ============================================================
spring.datasource.url=jdbc:h2:mem:labtest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
# ...but do not quote columnDefinition. Without this, @Column(columnDefinition = "TEXT")
# on Equipment and SharingAgreement is emitted as the quoted domain "TEXT", which H2
# cannot resolve, so those two CREATE TABLEs fail. Hibernate only logs the failure, so the
# suite still went green while the equipment table was silently absent from the test schema.
spring.jpa.properties.hibernate.globally_quoted_identifiers_skip_column_definitions=true
spring.jpa.show-sql=false

# Deterministic secrets for tests
app.jwt.secret=test-secret-key-for-unit-tests-only-256-bits-minimum-length-padding
app.jwt.expiration-ms=3600000
app.oauth.google-client-id=

# Never send real mail in tests
app.mail.enabled=false
app.mail.from=no-reply@test.local
spring.mail.host=localhost
spring.mail.port=3025
app.upload.dir=build/test-uploads

# Silence scheduling during tests
spring.task.scheduling.pool.size=1
