<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab Resource Utilization Platform</title>
  </head>
  <body>
    <div id="root">
      <div style="
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        width: 100vw;
        background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        color: #ffffff;
        font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        padding: 0;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
      ">
        <div style="
          width: 48px;
          height: 48px;
          border: 5px solid rgba(255, 255, 255, 0.1);
          border-top: 5px solid #3b82f6;
          border-radius: 50%;
          animation: spin 1s linear infinite;
          margin-bottom: 20px;
        "></div>
        <h2 style="
          font-weight: 800;
          margin: 0;
          letter-spacing: -0.5px;
          font-size: 1.5rem;
        ">
          LAB PLATFORM
        </h2>
        <p style="
          color: #94a3b8;
          font-size: 0.875rem;
          margin-top: 8px;
          font-weight: 500;
        ">
          Loading platform assets, please wait...
        </p>
        <style>
          @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
